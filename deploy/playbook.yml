---
- name: Run the Lollipop collector on the VPS
  hosts: collector
  vars:
    build_image: ghcr.io/rust-cross/cargo-zigbuild@sha256:eb5578cfc06e070a09deb7b5852474bd128a4e561f9f123261b5ed2405e478b1
    # A static musl binary does not depend on the host's glibc.
    build_target: "{{ ansible_facts['architecture'] }}-unknown-linux-musl"
    repository: '{{ playbook_dir }}/..'
  tasks:
    - name: Build the collector for the host's architecture
      delegate_to: localhost
      become: false
      changed_when: false
      ansible.builtin.command:
        chdir: '{{ repository }}'
        argv:
          - docker
          - run
          - --rm
          - --volume={{ repository | realpath }}:/io
          - --workdir=/io
          - --volume=lollipop-cargo-registry:/usr/local/cargo/registry
          - '{{ build_image }}'
          - cargo
          - zigbuild
          - --locked
          - --release
          - --package=lollipop-collector
          - --target={{ build_target }}
          - --target-dir=target/deploy

    - name: Install the packages the scripts and the collector call
      ansible.builtin.apt:
        name: [gh, rclone, sqlite3, zstd]
        update_cache: true
        cache_valid_time: 86400

    - name: Create the service user
      ansible.builtin.user:
        name: lollipop
        system: true
        shell: /usr/sbin/nologin
        # gh writes its state under the home directory.
        home: /var/lib/lollipop
        create_home: false

    - name: Create the data directory
      ansible.builtin.file:
        path: /var/lib/lollipop
        state: directory
        owner: lollipop
        group: lollipop
        mode: '0750'

    - name: Create the configuration directory
      ansible.builtin.file:
        path: /etc/lollipop
        state: directory
        owner: root
        group: lollipop
        mode: '0750'

    - name: Write the collector's key and settings
      no_log: true
      ansible.builtin.copy:
        content: "{{ item.content }}\n"
        dest: /etc/lollipop/{{ item.name }}
        owner: root
        group: lollipop
        mode: '0640'
      loop:
        - { name: riot-key, content: '{{ riot_api_key }}' }
        - { name: collector.env, content: 'LOLLIPOP_TIER={{ collector_tier }}' }
      notify: Restart the collector

    - name: Write the manifest signing key
      no_log: true
      ansible.builtin.copy:
        content: "{{ manifest_signing_key }}\n"
        dest: /etc/lollipop/manifest-key
        owner: root
        group: lollipop
        mode: '0640'

    - name: Write the publish token
      no_log: true
      ansible.builtin.copy:
        content: "GH_TOKEN={{ github_token }}\n"
        dest: /etc/lollipop/publish.env
        owner: root
        group: root
        mode: '0600'

    - name: Write the object storage settings
      no_log: true
      ansible.builtin.template:
        src: templates/backup.env.j2
        dest: /etc/lollipop/backup.env
        owner: root
        group: root
        mode: '0600'

    - name: Install the rework list
      ansible.builtin.copy:
        src: '{{ repository }}/crates/collector/reworks.json'
        dest: /etc/lollipop/reworks.json
        owner: root
        group: lollipop
        mode: '0640'

    - name: Install the collector
      ansible.builtin.copy:
        src: '{{ repository }}/target/deploy/{{ build_target }}/release/lollipop-collector'
        dest: /usr/local/bin/lollipop-collector
        owner: root
        group: root
        mode: '0755'
      notify: Restart the collector

    - name: Install the backup and restore scripts
      ansible.builtin.copy:
        src: scripts/{{ item }}
        dest: /usr/local/bin/{{ item }}
        owner: root
        group: root
        mode: '0755'
      loop: [lollipop-backup, lollipop-restore]

    - name: Install the systemd units
      ansible.builtin.copy:
        src: systemd/{{ item }}
        dest: /etc/systemd/system/{{ item }}
        owner: root
        group: root
        mode: '0644'
      loop:
        - lollipop-backup.service
        - lollipop-backup.timer
        - lollipop-collector.service
        - lollipop-publish.service
        - lollipop-publish.timer
        - lollipop-restore.service
      notify:
        - Reload systemd
        - Restart the collector

    - name: Apply the changes
      ansible.builtin.meta: flush_handlers

    - name: Start the collector, restoring the newest backup on a new host
      ansible.builtin.systemd_service:
        name: lollipop-collector.service
        state: started
        enabled: true

    - name: Start the timers
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        state: started
        enabled: true
      loop:
        - lollipop-backup.timer
        - lollipop-publish.timer

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart the collector
      ansible.builtin.systemd_service:
        name: lollipop-collector.service
        state: restarted
