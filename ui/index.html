<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Lollipop</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #pill {
        display: flex; gap: 12px; align-items: baseline; justify-content: center;
        height: 44px; box-sizing: border-box; padding: 11px 14px;
        border-radius: 10px; background: rgba(10, 14, 20, 0.78); color: #e8edf2;
        font: 600 15px/1.4 -apple-system, "Segoe UI", sans-serif;
        font-variant-numeric: tabular-nums; white-space: nowrap;
      }
      #rate { color: #9aa7b4; font-weight: 500; }
      .ahead { color: #5fd38d; }
      .behind { color: #f0876e; }
    </style>
  </head>
  <body>
    <div id="pill">
      <span>CS <span id="cs">0</span></span>
      <span id="rate">0.0/мин</span>
      <span id="delta">0</span>
    </div>
    <script>
      const el = (id) => document.getElementById(id);
      window.__TAURI__.event.listen("snapshot", ({ payload }) => {
        el("cs").textContent = payload.cs;
        el("rate").textContent = payload.cs_per_min.toFixed(1) + "/мин";
        const delta = payload.delta_to_target;
        el("delta").textContent = (delta > 0 ? "+" : delta < 0 ? "−" : "") + Math.abs(delta) + " к цели";
        el("delta").className = delta >= 0 ? "ahead" : "behind";
      });
    </script>
  </body>
</html>
